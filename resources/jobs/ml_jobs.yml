resources:
  jobs:
    train_churn_model:
      name: retail-train-churn-${bundle.target}
      max_concurrent_runs: 1
      tags:
        project: retail-lakehouse
        phase: ml
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${resources.schemas.retail_schema.name}
        - name: experiment_name
          default: ${resources.experiments.churn_experiment.name}
        - name: model_name
          default: ${var.catalog}.${resources.schemas.retail_schema.name}.churn_model
      tasks:
        - task_key: train
          spark_python_task:
            python_file: ../../src/ml/train.py
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
              - "--experiment-name"
              - "{{job.parameters.experiment_name}}"
              - "--model-name"
              - "{{job.parameters.model_name}}"
              - "--alias"
              - "challenger"
          environment_key: ml_env
      environments:
        - environment_key: ml_env
          spec:
            environment_version: "3"
            dependencies:
              - scikit-learn==1.5.2
              - mlflow==2.19.0
              - pandas==2.2.3
              - numpy==2.1.3

    promote_churn_model:
      name: retail-promote-churn-${bundle.target}
      max_concurrent_runs: 1
      tags:
        project: retail-lakehouse
        phase: ml
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${resources.schemas.retail_schema.name}
        - name: model_name
          default: ${var.catalog}.${resources.schemas.retail_schema.name}.churn_model
      tasks:
        - task_key: promote
          spark_python_task:
            python_file: ../../src/ml/promote.py
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
              - "--model-name"
              - "{{job.parameters.model_name}}"
          environment_key: ml_env
      environments:
        - environment_key: ml_env
          spec:
            environment_version: "3"
            dependencies:
              - scikit-learn==1.5.2
              - mlflow==2.19.0
              - pandas==2.2.3
              - numpy==2.1.3

    batch_score_churn:
      name: retail-batch-score-churn-${bundle.target}
      max_concurrent_runs: 1
      tags:
        project: retail-lakehouse
        phase: ml
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${resources.schemas.retail_schema.name}
        - name: model_name
          default: ${var.catalog}.${resources.schemas.retail_schema.name}.churn_model
      tasks:
        - task_key: batch_score
          spark_python_task:
            python_file: ../../src/ml/batch_score.py
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
              - "--model-name"
              - "{{job.parameters.model_name}}"
              - "--alias"
              - "champion"
          environment_key: ml_env
      environments:
        - environment_key: ml_env
          spec:
            environment_version: "3"
            dependencies:
              - scikit-learn==1.5.2
              - mlflow==2.19.0
              - pandas==2.2.3
              - numpy==2.1.3

    ml_train_promote_score:
      name: retail-ml-pipeline-${bundle.target}
      max_concurrent_runs: 1
      tags:
        project: retail-lakehouse
        phase: ml
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${resources.schemas.retail_schema.name}
        - name: experiment_name
          default: ${resources.experiments.churn_experiment.name}
        - name: model_name
          default: ${var.catalog}.${resources.schemas.retail_schema.name}.churn_model
      tasks:
        - task_key: train
          spark_python_task:
            python_file: ../../src/ml/train.py
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
              - "--experiment-name"
              - "{{job.parameters.experiment_name}}"
              - "--model-name"
              - "{{job.parameters.model_name}}"
              - "--alias"
              - "challenger"
          environment_key: ml_env
        - task_key: promote
          depends_on:
            - task_key: train
          spark_python_task:
            python_file: ../../src/ml/promote.py
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
              - "--model-name"
              - "{{job.parameters.model_name}}"
          environment_key: ml_env
        - task_key: batch_score
          depends_on:
            - task_key: promote
          spark_python_task:
            python_file: ../../src/ml/batch_score.py
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
              - "--model-name"
              - "{{job.parameters.model_name}}"
              - "--alias"
              - "champion"
          environment_key: ml_env
      environments:
        - environment_key: ml_env
          spec:
            environment_version: "3"
            dependencies:
              - scikit-learn==1.5.2
              - mlflow==2.19.0
              - pandas==2.2.3
              - numpy==2.1.3
