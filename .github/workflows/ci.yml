name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - name: Bundle files present
        run: |
          test -f databricks.yml
          test -f resources/jobs/ingest_job.yml
          test -f resources/pipelines/retail_pipeline.yml

  deploy-dev:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: test-and-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy bundle to dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "Skipping deploy — add DATABRICKS_HOST and DATABRICKS_TOKEN repository secrets to enable it"
            exit 0
          fi
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks bundle validate -t dev
          databricks bundle deploy -t dev
