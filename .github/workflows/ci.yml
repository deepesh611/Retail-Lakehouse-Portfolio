name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks -v

      - name: Bundle validate (syntax)
        # Validate without workspace auth: uses --force or offline where supported.
        # If auth is configured via secrets, full validate against workspace runs.
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_TOKEN" ]; then
            databricks bundle validate -t dev
          else
            echo "No Databricks secrets — skipping live bundle validate"
            echo "Locally run: databricks bundle validate -t dev"
            # Still parse YAML includes exist
            test -f databricks.yml
            test -f resources/jobs/ingest_job.yml
            test -f resources/pipelines/retail_pipeline.yml
          fi

  deploy-dev:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: test-and-validate
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      - name: Deploy bundle to dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "Skipping deploy — configure DATABRICKS_HOST and DATABRICKS_TOKEN secrets"
            exit 0
          fi
          databricks bundle validate -t dev
          databricks bundle deploy -t dev
